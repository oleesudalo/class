<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>청소년 금융 챗봇 프롬프트 만들기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        /* Hide default radio and checkbox */
        .custom-radio, .custom-checkbox {
            display: none;
        }
        /* Checked states handled by Tailwind 'peer' classes */
        
        /* Toast Animation */
        #toast {
            transition: opacity 0.3s, transform 0.3s;
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
        }
        #toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen pb-20">

    <div class="max-w-4xl mx-auto px-4 py-10">
        <!-- Header -->
        <div class="text-center mb-10">
            <h1 class="text-3xl md:text-4xl font-bold text-indigo-600 mb-3">🤖 청소년 금융 챗봇 프롬프트 만들기</h1>
            <p class="text-gray-600 text-lg">타자를 칠 필요 없어요! 원하는 항목을 클릭해서 나만의 챗봇을 만들어보세요.</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            
            <!-- Left Column: Options (Form) -->
            <div class="space-y-8">
                
                <!-- 1. Role Section -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <h2 class="text-xl font-bold mb-4 text-gray-800 flex items-center">
                        <span class="bg-indigo-100 text-indigo-600 w-8 h-8 rounded-full flex items-center justify-center mr-2 text-sm">1</span>
                        역할 (Role)
                    </h2>
                    <p class="text-sm text-gray-500 mb-4">챗봇이 어떤 역할을 할지 1가지만 선택하세요.</p>
                    <div class="space-y-3" id="role-group">
                        <label class="block cursor-pointer">
                            <input type="radio" name="role" value="친근하고 든든한 동네 형/누나" class="custom-radio peer" checked>
                            <div class="p-4 rounded-xl border-2 border-gray-200 peer-checked:border-indigo-500 peer-checked:bg-indigo-50 hover:bg-gray-50 transition-all">
                                <div class="font-semibold text-gray-800 peer-checked:text-indigo-700">👦 친근한 동네 형/누나</div>
                                <div class="text-sm text-gray-500 mt-1">편안하게 다가갈 수 있는 친근한 역할</div>
                            </div>
                        </label>
                        <label class="block cursor-pointer">
                            <input type="radio" name="role" value="똑똑하고 친절한 금융 전문가 선생님" class="custom-radio peer">
                            <div class="p-4 rounded-xl border-2 border-gray-200 peer-checked:border-indigo-500 peer-checked:bg-indigo-50 hover:bg-gray-50 transition-all">
                                <div class="font-semibold text-gray-800 peer-checked:text-indigo-700">👩‍🏫 금융 전문가 선생님</div>
                                <div class="text-sm text-gray-500 mt-1">정확하고 믿음직스럽게 알려주는 역할</div>
                            </div>
                        </label>
                        <label class="block cursor-pointer">
                            <input type="radio" name="role" value="돈을 모으는 걸 도와주는 귀여운 동물 저금통 요정" class="custom-radio peer">
                            <div class="p-4 rounded-xl border-2 border-gray-200 peer-checked:border-indigo-500 peer-checked:bg-indigo-50 hover:bg-gray-50 transition-all">
                                <div class="font-semibold text-gray-800 peer-checked:text-indigo-700">🐷 귀여운 저금통 요정</div>
                                <div class="text-sm text-gray-500 mt-1">저축을 응원하는 귀엽고 발랄한 역할</div>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- 2. Tone Section -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <h2 class="text-xl font-bold mb-4 text-gray-800 flex items-center">
                        <span class="bg-indigo-100 text-indigo-600 w-8 h-8 rounded-full flex items-center justify-center mr-2 text-sm">2</span>
                        말투 (Tone)
                    </h2>
                    <p class="text-sm text-gray-500 mb-4">어떤 말투로 이야기할지 1가지만 선택하세요.</p>
                    <div class="space-y-3" id="tone-group">
                        <label class="block cursor-pointer">
                            <input type="radio" name="tone" value="유행어를 섞어서 재미있고 친근한 반말로 이야기해." class="custom-radio peer" checked>
                            <div class="p-4 rounded-xl border-2 border-gray-200 peer-checked:border-indigo-500 peer-checked:bg-indigo-50 hover:bg-gray-50 transition-all">
                                <div class="font-semibold text-gray-800 peer-checked:text-indigo-700">💬 재미있고 친근한 반말</div>
                                <div class="text-sm text-gray-500 mt-1">예: "안녕! 오늘 용돈 관리는 잘 하고 있어? 대박 꿀팁 알려줄게!"</div>
                            </div>
                        </label>
                        <label class="block cursor-pointer">
                            <input type="radio" name="tone" value="존댓말로 다정하고 따뜻하게 이야기해." class="custom-radio peer">
                            <div class="p-4 rounded-xl border-2 border-gray-200 peer-checked:border-indigo-500 peer-checked:bg-indigo-50 hover:bg-gray-50 transition-all">
                                <div class="font-semibold text-gray-800 peer-checked:text-indigo-700">☕ 다정하고 따뜻한 존댓말</div>
                                <div class="text-sm text-gray-500 mt-1">예: "안녕하세요! 금융에 대해 궁금한 점이 있으신가요? 제가 도와드릴게요."</div>
                            </div>
                        </label>
                        <label class="block cursor-pointer">
                            <input type="radio" name="tone" value="이모티콘을 많이 사용해서 밝고 활기차게 이야기해." class="custom-radio peer">
                            <div class="p-4 rounded-xl border-2 border-gray-200 peer-checked:border-indigo-500 peer-checked:bg-indigo-50 hover:bg-gray-50 transition-all">
                                <div class="font-semibold text-gray-800 peer-checked:text-indigo-700">✨ 이모티콘 듬뿍 발랄한 말투</div>
                                <div class="text-sm text-gray-500 mt-1">예: "안녕 안녕! 👋 오늘 저축 목표 달성했구나! 정말 대단해! 🎉"</div>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- 3. Functions Section -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <h2 class="text-xl font-bold mb-4 text-gray-800 flex items-center">
                        <span class="bg-indigo-100 text-indigo-600 w-8 h-8 rounded-full flex items-center justify-center mr-2 text-sm">3</span>
                        기능 (Functions)
                    </h2>
                    <p class="text-sm text-gray-500 mb-4">챗봇이 할 수 있는 일을 모두 고르세요. (여러 개 선택 가능)</p>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="function-group">
                        <label class="block cursor-pointer">
                            <input type="checkbox" name="functions" value="어려운 금융 단어를 10대가 이해하기 쉽게 예시를 들어 설명한다." class="custom-checkbox peer" checked>
                            <div class="h-full p-4 rounded-xl border-2 border-gray-200 peer-checked:border-indigo-500 peer-checked:bg-indigo-50 hover:bg-gray-50 transition-all">
                                <div class="font-semibold text-gray-800 peer-checked:text-indigo-700">📖 쉬운 단어 설명</div>
                            </div>
                        </label>
                        <label class="block cursor-pointer">
                            <input type="checkbox" name="functions" value="용돈 기입장 쓰는 방법과 예산을 세우는 방법을 알려준다." class="custom-checkbox peer" checked>
                            <div class="h-full p-4 rounded-xl border-2 border-gray-200 peer-checked:border-indigo-500 peer-checked:bg-indigo-50 hover:bg-gray-50 transition-all">
                                <div class="font-semibold text-gray-800 peer-checked:text-indigo-700">📝 용돈 기입장 쓰기 돕기</div>
                            </div>
                        </label>
                        <label class="block cursor-pointer">
                            <input type="checkbox" name="functions" value="사용자가 사고 싶은 물건이 있을 때, 충동구매인지 스스로 생각하게 질문한다." class="custom-checkbox peer">
                            <div class="h-full p-4 rounded-xl border-2 border-gray-200 peer-checked:border-indigo-500 peer-checked:bg-indigo-50 hover:bg-gray-50 transition-all">
                                <div class="font-semibold text-gray-800 peer-checked:text-indigo-700">🛑 충동구매 막기</div>
                            </div>
                        </label>
                        <label class="block cursor-pointer">
                            <input type="checkbox" name="functions" value="사고 싶은 물건을 위해 얼마를 어떻게 모아야 할지 저축 계획을 세워준다." class="custom-checkbox peer">
                            <div class="h-full p-4 rounded-xl border-2 border-gray-200 peer-checked:border-indigo-500 peer-checked:bg-indigo-50 hover:bg-gray-50 transition-all">
                                <div class="font-semibold text-gray-800 peer-checked:text-indigo-700">💰 저축 계획 세우기</div>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- 4. Constraints Section -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <h2 class="text-xl font-bold mb-4 text-gray-800 flex items-center">
                        <span class="bg-indigo-100 text-indigo-600 w-8 h-8 rounded-full flex items-center justify-center mr-2 text-sm">4</span>
                        주의사항 (Rules)
                    </h2>
                    <p class="text-sm text-gray-500 mb-4">챗봇이 지켜야 할 규칙을 고르세요. (여러 개 선택 가능)</p>
                    <div class="space-y-3" id="rule-group">
                        <label class="block cursor-pointer">
                            <input type="checkbox" name="rules" value="주식, 코인 등 청소년에게 너무 복잡하거나 위험한 투자 이야기는 피한다." class="custom-checkbox peer" checked>
                            <div class="p-4 rounded-xl border-2 border-gray-200 peer-checked:border-rose-500 peer-checked:bg-rose-50 hover:bg-gray-50 transition-all">
                                <div class="font-semibold text-gray-800 peer-checked:text-rose-700">🚫 복잡한 투자 이야기 금지</div>
                            </div>
                        </label>
                        <label class="block cursor-pointer">
                            <input type="checkbox" name="rules" value="사용자가 돈을 낭비했다고 해서 훈계하거나 혼내지 말고, 앞으로 잘할 수 있다고 응원한다." class="custom-checkbox peer" checked>
                            <div class="p-4 rounded-xl border-2 border-gray-200 peer-checked:border-rose-500 peer-checked:bg-rose-50 hover:bg-gray-50 transition-all">
                                <div class="font-semibold text-gray-800 peer-checked:text-rose-700">❤️ 훈계하지 않고 응원하기</div>
                            </div>
                        </label>
                        <label class="block cursor-pointer">
                            <input type="checkbox" name="rules" value="비밀번호, 통장 계좌번호 같은 개인정보는 절대 묻지 않는다." class="custom-checkbox peer" checked>
                            <div class="p-4 rounded-xl border-2 border-gray-200 peer-checked:border-rose-500 peer-checked:bg-rose-50 hover:bg-gray-50 transition-all">
                                <div class="font-semibold text-gray-800 peer-checked:text-rose-700">🔒 개인정보 절대 묻지 않기</div>
                            </div>
                        </label>
                    </div>
                </div>

            </div>

            <!-- Right Column: Live Preview & Output -->
            <div class="lg:sticky lg:top-10 h-fit space-y-4">
                <div class="bg-gray-800 rounded-2xl shadow-xl overflow-hidden flex flex-col h-[600px]">
                    <!-- Header of preview -->
                    <div class="bg-gray-900 px-4 py-3 flex justify-between items-center border-b border-gray-700">
                        <h3 class="text-white font-semibold flex items-center">
                            <svg class="w-5 h-5 mr-2 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                            완성된 프롬프트
                        </h3>
                    </div>
                    <!-- Textarea for the prompt -->
                    <textarea id="prompt-output" class="w-full flex-grow bg-gray-800 text-green-400 p-5 font-mono text-sm resize-none focus:outline-none focus:ring-0 leading-relaxed" readonly></textarea>
                    
                    <!-- Copy Button Area -->
                    <div class="bg-gray-900 p-4">
                        <button onclick="copyPrompt()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg transform transition active:scale-95 flex items-center justify-center">
                            <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                            복사하기 (Copy)
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Custom Toast Notification -->
    <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full shadow-2xl flex items-center z-50">
        <svg class="w-6 h-6 text-green-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        프롬프트가 복사되었습니다!
    </div>

    <script>
        // DOM Elements
        const outputTextarea = document.getElementById('prompt-output');
        const inputs = document.querySelectorAll('input');

        // Function to generate the prompt string based on selections
        function generatePrompt() {
            // Get Role
            const roleEl = document.querySelector('input[name="role"]:checked');
            const role = roleEl ? roleEl.value : "";

            // Get Tone
            const toneEl = document.querySelector('input[name="tone"]:checked');
            const tone = toneEl ? toneEl.value : "";

            // Get Functions
            const functionEls = document.querySelectorAll('input[name="functions"]:checked');
            let functionsText = "";
            functionEls.forEach(el => {
                functionsText += `- ${el.value}\n`;
            });
            if(functionsText === "") functionsText = "- 사용자의 질문에 친절하게 답한다.\n"; // Default if none selected

            // Get Rules
            const ruleEls = document.querySelectorAll('input[name="rules"]:checked');
            let rulesText = "";
            ruleEls.forEach(el => {
                rulesText += `- ${el.value}\n`;
            });
            if(rulesText === "") rulesText = "- 사용자에게 해로운 정보는 제공하지 않는다.\n";

            // Build the final string
            const promptTemplate = `# 역할
당신은 청소년을 위한 [${role}]입니다.

# 말투
- ${tone}

# 기능
당신은 다음과 같은 기능을 수행합니다:
${functionsText}
# 주의사항
${rulesText}`;

            // Update textarea
            outputTextarea.value = promptTemplate;
        }

        // Add event listeners to all inputs to update live preview
        inputs.forEach(input => {
            input.addEventListener('change', generatePrompt);
        });

        // Copy to clipboard function (using fallback logic for iframe support)
        function copyPrompt() {
            outputTextarea.select();
            outputTextarea.setSelectionRange(0, 99999); /* For mobile devices */
            
            try {
                // Using document.execCommand as fallback which is more reliable in certain strict iframes
                const successful = document.execCommand('copy');
                if(successful) {
                    showToast();
                } else {
                    alert("복사에 실패했습니다. 텍스트를 직접 드래그해서 복사해주세요.");
                }
            } catch (err) {
                alert("복사에 실패했습니다. 텍스트를 직접 드래그해서 복사해주세요.");
            }
            
            // Remove selection
            window.getSelection().removeAllRanges();
        }

        // Toast notification logic
        let toastTimeout;
        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Initialize preview on load
        window.onload = () => {
            generatePrompt();
        };
    </script>
</body>
</html>
