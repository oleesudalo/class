<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 게임 기획서</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f0fdf4; /* 연한 민트 배경 */
            background-image: 
                radial-gradient(#a7f3d0 2px, transparent 2px),
                radial-gradient(#a7f3d0 2px, transparent 2px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
        }

        .document-container {
            background-color: white;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border: 4px solid #94a3b8; /* 바깥쪽 회색 테두리 */
            border-radius: 1.5rem;
            position: relative;
        }

        .document-container::before {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 2px solid #e2e8f0; /* 안쪽 연한 테두리 */
            border-radius: 1.25rem;
            pointer-events: none;
        }

        /* 텍스트 입력 영역 스타일 */
        textarea, input[type="text"] {
            width: 100%;
            border: none;
            background-color: transparent;
            resize: none;
            outline: none;
            color: #334155;
            transition: background-color 0.2s;
        }

        textarea:hover, input[type="text"]:hover,
        textarea:focus, input[type="text"]:focus {
            background-color: #f8fafc;
            border-radius: 0.25rem;
            box-shadow: inset 0 0 0 1px #cbd5e1;
        }

        /* 스크롤바 커스텀 */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* 인쇄 스타일 설정 */
        @media print {
            body {
                background: white;
                margin: 0;
                padding: 0;
            }
            .no-print {
                display: none !important;
            }
            .document-container {
                box-shadow: none;
                border: 2px solid #ccc;
                width: 100%;
                margin: 0;
                padding: 20px;
            }
            textarea, input[type="text"] {
                box-shadow: none !important;
                background-color: transparent !important;
            }
            /* 인쇄 시 스크롤이 아닌 전체 내용이 나오게 함 */
            textarea {
                overflow: visible;
            }
        }
        
        .header-shadow {
            text-shadow: 2px 2px 0px white, -2px -2px 0px white, 2px -2px 0px white, -2px 2px 0px white;
        }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex flex-col items-center">

    <div class="w-full max-w-4xl flex justify-end mb-4 no-print">
        <button onclick="window.print()" class="bg-teal-500 hover:bg-teal-600 text-white font-bold py-2 px-6 rounded-full shadow-md transition duration-300 flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
            </svg>
            인쇄하기
        </button>
    </div>

    <!-- 전체 문서 컨테이너 -->
    <div class="w-full max-w-4xl relative">
        
        <!-- 상단 헤더 영역 -->
        <div class="flex flex-col mb-6 z-10 relative px-4">
            <div class="mb-4">
                <p class="text-gray-800 font-bold text-lg mb-1 whitespace-nowrap">AI와 대화하며 만드는 나만의 게임</p>
                <h1 class="text-5xl font-black text-black tracking-tight header-shadow whitespace-nowrap">게임 기획서</h1>
            </div>
            
            <!-- 학년, 반, 이름 입력란 -->
            <div class="bg-white rounded-full px-6 py-3 shadow-md border-2 border-gray-200 flex flex-wrap gap-4 items-center w-full max-w-lg mt-4">
                <div class="flex items-center gap-2 flex-1 min-w-[80px]">
                    <label class="font-bold whitespace-nowrap">학년:</label>
                    <input type="text" class="w-full border-b border-gray-300 focus:border-teal-500" placeholder="0">
                </div>
                <div class="flex items-center gap-2 flex-1 min-w-[80px]">
                    <label class="font-bold whitespace-nowrap">반:</label>
                    <input type="text" class="w-full border-b border-gray-300 focus:border-teal-500" placeholder="0">
                </div>
                <div class="flex items-center gap-2 flex-1 min-w-[100px]">
                    <label class="font-bold whitespace-nowrap">이름:</label>
                    <input type="text" class="w-full border-b border-gray-300 focus:border-teal-500" placeholder="홍길동">
                </div>
            </div>
        </div>

        <div class="document-container p-6 md:p-10 pt-8 z-0">
            
            <!-- 게임 기본 정보 -->
            <div class="bg-[#f0f9f4] rounded-2xl p-6 mb-10 flex flex-col md:flex-row items-center gap-6 border border-[#d1fae5]">
                <div class="w-20 h-20 bg-white rounded-full flex items-center justify-center shadow-sm shrink-0">
                    <span class="text-4xl">🤖</span>
                </div>
                
                <div class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-y-4 gap-x-8 w-full">
                    <div class="flex items-center gap-3 col-span-1 md:col-span-2">
                        <label class="font-bold text-gray-700 whitespace-nowrap">게임 제목:</label>
                        <input type="text" class="text-lg font-bold border-b border-gray-300 focus:border-teal-500 pb-1 flex-1" placeholder="내 멋진 게임 이름">
                    </div>
                    <div class="flex items-center gap-3">
                        <label class="font-bold text-gray-700 whitespace-nowrap">플레이 시간:</label>
                        <input type="text" class="text-right w-16 border-b border-gray-300 focus:border-teal-500 pb-1" placeholder="00">
                        <span class="text-gray-600 text-sm">[분]</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <label class="font-bold text-gray-700 whitespace-nowrap">게임 개발자:</label>
                        <input type="text" class="border-b border-gray-300 focus:border-teal-500 pb-1 flex-1" placeholder="개발자 이름">
                    </div>
                </div>
            </div>

            <div class="mb-12">
                <h2 class="text-2xl font-black text-teal-600 mb-4 flex items-center gap-2">
                    <span>🎮</span> 핵심 설계
                </h2>
                
                <div class="border-t-2 border-teal-600">
                    <!-- 테이블 헤더 -->
                    <div class="grid grid-cols-[100px_1fr] bg-teal-50 border-b border-teal-200">
                        <div class="p-3 font-bold text-gray-700 text-center">단계</div>
                        <div class="p-3 font-bold text-gray-700 border-l border-teal-200">보상</div>
                    </div>
                    
                    <!-- 입력 줄 1 -->
                    <div class="grid grid-cols-[100px_1fr] border-b border-gray-200">
                        <div class="p-4 font-medium text-gray-600 text-center flex items-center justify-center">기본</div>
                        <div class="p-3 border-l border-gray-200 h-full">
                            <textarea class="w-full h-full min-h-[60px] p-2 placeholder-gray-400 text-gray-700" placeholder="[정답 시] 어떤 보상을 주나요?"></textarea>
                        </div>
                    </div>
                    
                    <!-- 입력 줄 2 -->
                    <div class="grid grid-cols-[100px_1fr] border-b border-gray-200">
                        <div class="p-4 font-medium text-gray-600 text-center flex items-center justify-center">특별</div>
                        <div class="p-3 border-l border-gray-200 h-full">
                            <textarea class="w-full h-full min-h-[60px] p-2 placeholder-gray-400 text-gray-700" placeholder="[연속 성공 시] 어떤 특별한 보상을 주나요?"></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mb-8">
                <h2 class="text-2xl font-black text-teal-600 mb-4 flex items-center gap-2">
                    <span>💎</span> 보상 시스템 <span class="text-sm font-normal text-gray-500">(상세 기획)</span>
                </h2>
                
                <div class="border-t-2 border-teal-600">
                    <!-- 테이블 헤더 -->
                    <div class="grid grid-cols-[100px_1fr] bg-teal-50 border-b border-teal-200">
                        <div class="p-3 font-bold text-gray-700 text-center">항목</div>
                        <div class="p-3 font-bold text-gray-700 border-l border-teal-200">내용</div>
                    </div>
                    
                    <!-- 입력 줄 1 -->
                    <div class="grid grid-cols-[100px_1fr] border-b border-gray-200">
                        <div class="p-4 font-medium text-gray-600 text-center flex items-center justify-center">문제</div>
                        <div class="p-3 border-l border-gray-200 h-full">
                            <textarea class="w-full h-full min-h-[80px] p-2 placeholder-gray-400 text-gray-700" placeholder="[해결할 문제] 플레이어가 게임에서 어떤 문제를 풀어야 하나요?"></textarea>
                        </div>
                    </div>
                    
                    <!-- 입력 줄 2 -->
                    <div class="grid grid-cols-[100px_1fr] border-b border-gray-200">
                        <div class="p-4 font-medium text-gray-600 text-center flex items-center justify-center">목표</div>
                        <div class="p-3 border-l border-gray-200 h-full">
                            <textarea class="w-full h-full min-h-[80px] p-2 placeholder-gray-400 text-gray-700" placeholder="[구체적 목표] 게임의 최종 목적은 무엇인가요?"></textarea>
                        </div>
                    </div>
                    
                    <!-- 입력 줄 3 -->
                    <div class="grid grid-cols-[100px_1fr] border-b border-gray-200">
                        <div class="p-4 font-medium text-gray-600 text-center flex items-center justify-center">타겟</div>
                        <div class="p-3 border-l border-gray-200 h-full">
                            <textarea class="w-full h-full min-h-[80px] p-2 placeholder-gray-400 text-gray-700" placeholder="[연령대/대상] 누가 이 게임을 재미있게 할 수 있을까요?"></textarea>
                        </div>
                    </div>
                    
                    <!-- 입력 줄 4 -->
                    <div class="grid grid-cols-[100px_1fr] border-b border-gray-200">
                        <div class="p-4 font-medium text-gray-600 text-center flex items-center justify-center">방식</div>
                        <div class="p-3 border-l border-gray-200 h-full">
                            <textarea class="w-full h-full min-h-[80px] p-2 placeholder-gray-400 text-gray-700" placeholder="[게임 조작 방법] 키보드, 마우스 등을 어떻게 사용하나요?"></textarea>
                        </div>
                    </div>
                    
                    <!-- 입력 줄 5 -->
                    <div class="grid grid-cols-[100px_1fr] border-b border-gray-200">
                        <div class="p-4 font-medium text-gray-600 text-center flex items-center justify-center">승리</div>
                        <div class="p-3 border-l border-gray-200 h-full">
                            <textarea class="w-full h-full min-h-[80px] p-2 placeholder-gray-400 text-gray-700" placeholder="[이기는 조건] 어떻게 하면 게임에서 승리(클리어)하나요?"></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 하단 여백 및 장식용 (인쇄 시 공간 확보) -->
            <div class="h-16"></div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // textarea 텍스트 입력 시 높이 자동 조절 및 스크롤 처리
            const textareas = document.querySelectorAll('textarea');
            
            textareas.forEach(textarea => {
                // 초기 높이 설정 및 이벤트 리스너 추가
                textarea.addEventListener('input', function() {
                    // 스크롤이 생기도록 하려면 높이를 제한해야 합니다.
                    // 현재는 Tailwind의 min-h-[xx px] 클래스와 
                    // css의 overflow 기본값(auto)으로 인해 내용이 길어지면 자동으로 스크롤바가 생깁니다.
                    
                    // 만약 입력하는 대로 창이 밑으로 끝없이 늘어나길 원한다면 아래 코드를 활성화하세요.
                    /*
                    this.style.height = 'auto';
                    this.style.height = (this.scrollHeight) + 'px';
                    */
                });
            });

            // 인쇄 전 이벤트 (텍스트에어리어 스크롤 문제 해결)
            window.addEventListener('beforeprint', () => {
                textareas.forEach(textarea => {
                    // 인쇄할 때는 스크롤 대신 내용이 다 보이도록 전체 높이로 늘려줌
                    textarea.style.height = 'auto';
                    textarea.style.height = textarea.scrollHeight + 'px';
                });
            });
        });
    </script>
</body>
</html>
