<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모던 순서 추첨기</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Matter.js for 2D Physics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <!-- Pretendard Font for Modern UI -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    
    <style>
        body {
            font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
            background-color: #f8fafc; /* Tailwind slate-50 */
            color: #0f172a; /* Tailwind slate-900 */
        }
        
        /* Minimalist Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        #canvas-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 4 / 5;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            overflow: hidden;
            margin: 0 auto;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Subtle Blur for Overlay */
        .blur-overlay {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid #f1f5f9;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-10 antialiased selection:bg-slate-800 selection:text-white">

    <header class="max-w-6xl mx-auto mb-10 border-b border-slate-200 pb-6 flex flex-col md:flex-row items-end justify-between">
        <div>
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-slate-900">Sequence Draw.</h1>
            <p class="text-slate-500 mt-2 text-sm md:text-base font-medium">안전하고 세련된 교실용 순서 추첨 도구</p>
        </div>
    </header>

    <main class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-12 gap-8">
        
        <!-- Left Panel: Inputs -->
        <section class="md:col-span-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col h-full max-h-[800px]">
            <h2 class="text-lg font-bold mb-2 text-slate-800 tracking-tight">
                참가자 명단
            </h2>
            
            <p class="text-xs text-slate-400 mb-4 font-medium">이름이나 번호를 줄바꿈으로 구분하여 입력하세요.</p>
            
            <textarea id="nameInput" class="w-full flex-grow p-4 bg-slate-50 border border-slate-200 rounded-xl resize-none focus:outline-none focus:ring-2 focus:ring-slate-900 focus:bg-white text-slate-700 text-sm md:text-base transition-all duration-200" placeholder="김철수&#10;이영희&#10;박지민"></textarea>
            
            <div class="mt-6 flex flex-col gap-3">
                <button id="startBtn" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3.5 rounded-xl transition-colors duration-200 flex items-center justify-center">
                    추첨 시작
                </button>
                <button id="resetBtn" class="w-full bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 font-medium py-3.5 rounded-xl transition-colors duration-200">
                    초기화
                </button>
            </div>
        </section>

        <!-- Right Panel: Canvas & Rankings -->
        <section class="md:col-span-8 relative">
            <div id="canvas-container">
                <!-- Physics Canvas will be injected here -->
                <canvas id="gameCanvas"></canvas>
                
                <!-- In-game Ranking Panel (Overlay) -->
                <div id="rankingPanel" class="absolute top-4 right-4 w-56 blur-overlay rounded-xl p-5 shadow-sm hidden">
                    <h3 class="text-sm font-bold text-slate-800 mb-3 tracking-wide">실시간 순위</h3>
                    <ul id="rankingList" class="space-y-1 text-sm max-h-72 overflow-y-auto pr-1">
                        <!-- Rankings will appear here -->
                    </ul>
                </div>
            </div>
        </section>

    </main>

    <!-- Custom Modal for Alerts -->
    <div id="alertModal" class="fixed inset-0 bg-slate-900/20 backdrop-blur-sm hidden items-center justify-center z-50 transition-opacity opacity-0">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full mx-4 shadow-xl transform scale-95 transition-transform duration-300 border border-slate-100">
            <div class="text-left">
                <h3 id="alertTitle" class="text-xl font-bold text-slate-900 mb-2">Notice</h3>
                <p id="alertMessage" class="text-slate-500 text-sm mb-6 leading-relaxed">메시지가 여기에 표시됩니다.</p>
                <div class="flex justify-end">
                    <button id="alertCloseBtn" class="bg-slate-900 hover:bg-slate-800 text-white font-medium py-2.5 px-6 rounded-lg transition-colors text-sm">
                        확인
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Matter.js modules
        const Engine = Matter.Engine,
              Render = Matter.Render,
              Runner = Matter.Runner,
              Bodies = Matter.Bodies,
              Composite = Matter.Composite,
              Events = Matter.Events,
              Vector = Matter.Vector;

        let engine, runner;
        let marbles = [];
        let isSimulating = false;
        let rankings = [];
        let totalParticipants = 0;

        // Modern, muted, and sophisticated colors (Tailwind 500/600 variants)
        const marbleColors = [
            '#334155', // Slate
            '#2563eb', // Blue
            '#059669', // Emerald
            '#d97706', // Amber
            '#dc2626', // Red
            '#7c3aed', // Violet
            '#0891b2', // Cyan
            '#be123c', // Rose
            '#4f46e5', // Indigo
            '#ea580c'  // Orange
        ];

        // Canvas Setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        
        // Logical resolution for physics (scaled via CSS)
        const logicalWidth = 800;
        const logicalHeight = 1000;
        canvas.width = logicalWidth;
        canvas.height = logicalHeight;

        // UI Elements
        const nameInput = document.getElementById('nameInput');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const rankingPanel = document.getElementById('rankingPanel');
        const rankingList = document.getElementById('rankingList');
        
        // Modal Elements
        const alertModal = document.getElementById('alertModal');
        const alertTitle = document.getElementById('alertTitle');
        const alertMessage = document.getElementById('alertMessage');
        const alertCloseBtn = document.getElementById('alertCloseBtn');

        function showAlert(title, message) {
            alertTitle.textContent = title;
            alertMessage.textContent = message;
            alertModal.classList.remove('hidden');
            alertModal.classList.add('flex');
            
            setTimeout(() => {
                alertModal.classList.remove('opacity-0');
                alertModal.querySelector('div').classList.remove('scale-95');
                alertModal.querySelector('div').classList.add('scale-100');
            }, 10);
        }

        alertCloseBtn.addEventListener('click', () => {
            alertModal.classList.add('opacity-0');
            alertModal.querySelector('div').classList.remove('scale-100');
            alertModal.querySelector('div').classList.add('scale-95');
            setTimeout(() => {
                alertModal.classList.remove('flex');
                alertModal.classList.add('hidden');
            }, 300);
        });

        function initPhysics() {
            if (engine) {
                Matter.Engine.clear(engine);
                if (runner) Matter.Runner.stop(runner);
            }

            engine = Engine.create();
            engine.world.gravity.y = 0.85; 

            // Create Board Boundaries (Walls) - Invisible
            const wallOptions = { isStatic: true, render: { visible: false }, friction: 0, restitution: 0.2, label: 'wall' };
            const groundSensorOptions = { isStatic: true, isSensor: true, label: 'finishLine' };

            Composite.add(engine.world, [
                // Left wall
                Bodies.rectangle(-25, logicalHeight / 2, 50, logicalHeight + 200, wallOptions),
                // Right wall
                Bodies.rectangle(logicalWidth + 25, logicalHeight / 2, 50, logicalHeight + 200, wallOptions),
                // Finish Line Sensor
                Bodies.rectangle(logicalWidth / 2, logicalHeight + 50, logicalWidth + 200, 100, groundSensorOptions)
            ]);

            // Create Plinko Pegs (Modern Layout)
            const rows = 12;
            const cols = 9;
            const spacingX = 85;
            const spacingY = 70;
            const startX = 60;
            const startY = 150;

            for (let row = 0; row < rows; row++) {
                let rowCols = (row % 2 === 0) ? cols : cols - 1;
                let offsetX = (row % 2 === 0) ? 0 : spacingX / 2;
                
                for (let col = 0; col < rowCols; col++) {
                    let x = startX + col * spacingX + offsetX;
                    let y = startY + row * spacingY;
                    
                    let peg = Bodies.circle(x, y, 4, { // Smaller, sleeker pegs
                        isStatic: true, 
                        label: 'peg', 
                        restitution: 0.5,
                        friction: 0.05
                    });
                    Composite.add(engine.world, peg);
                }
            }

            Events.on(engine, 'collisionStart', function(event) {
                const pairs = event.pairs;
                for (let i = 0; i < pairs.length; i++) {
                    const bodyA = pairs[i].bodyA;
                    const bodyB = pairs[i].bodyB;
                    
                    if (bodyA.label === 'finishLine' && bodyB.customType === 'marble') {
                        recordFinish(bodyB);
                    } else if (bodyB.label === 'finishLine' && bodyA.customType === 'marble') {
                        recordFinish(bodyA);
                    }
                }
            });
        }

        function recordFinish(marbleBody) {
            if (marbleBody.isFinished) return;
            marbleBody.isFinished = true;

            const rank = rankings.length + 1;
            rankings.push({ rank: rank, name: marbleBody.nameText, color: marbleBody.color });
            
            Composite.remove(engine.world, marbleBody);
            updateRankingUI();

            if (rankings.length === totalParticipants) {
                setTimeout(() => {
                    isSimulating = false;
                    showAlert('추첨 완료', '모든 순위가 결정되었습니다.');
                }, 800);
            }
        }

        function updateRankingUI() {
            rankingList.innerHTML = '';
            rankings.forEach(item => {
                const li = document.createElement('li');
                li.className = 'flex items-center py-2 px-1 border-b border-slate-100 last:border-0';
                
                // Format rank with leading zero (01, 02...)
                const formattedRank = String(item.rank).padStart(2, '0');
                
                li.innerHTML = `
                    <span class="w-8 text-xs font-bold text-slate-400 mr-2">${formattedRank}</span>
                    <span class="w-3 h-3 rounded-full mr-3" style="background-color: ${item.color};"></span>
                    <span class="font-medium text-slate-700 truncate flex-1">${item.name}</span>
                `;
                rankingList.appendChild(li);
            });
            rankingList.scrollTop = rankingList.scrollHeight;
        }

        function spawnMarbles(names) {
            marbles = [];
            totalParticipants = names.length;
            
            const spawnWidth = logicalWidth - 100;
            const startX = 50;
            const startY = -300; 
            
            names.forEach((name, index) => {
                let x = startX + (Math.random() * spawnWidth);
                let y = startY - (Math.random() * 400);
                
                let radius = 20; 
                
                let marble = Bodies.circle(x, y, radius, {
                    restitution: 0.7, 
                    friction: 0.005,
                    density: 0.04,
                    frictionAir: 0.02,
                    label: 'marble',
                    customType: 'marble'
                });
                
                marble.nameText = name;
                marble.color = marbleColors[index % marbleColors.length];
                marble.isFinished = false;
                
                marbles.push(marble);
            });
            
            Composite.add(engine.world, marbles);
        }

        function renderLoop() {
            if (!isSimulating) return;

            requestAnimationFrame(renderLoop);
            Engine.update(engine, 1000 / 60);

            // Clear canvas completely
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const bodies = Composite.allBodies(engine.world);
            
            for (let i = 0; i < bodies.length; i++) {
                const body = bodies[i];
                
                if (body.label === 'peg') {
                    // Draw Pegs (Minimalist subtle dots)
                    ctx.fillStyle = '#cbd5e1'; // slate-300
                    ctx.beginPath();
                    ctx.arc(body.position.x, body.position.y, body.circleRadius, 0, 2 * Math.PI);
                    ctx.fill();

                } else if (body.customType === 'marble' && !body.isFinished) {
                    // Draw Marbles (Flat, clean, modern)
                    ctx.translate(body.position.x, body.position.y);
                    ctx.rotate(body.angle);
                    
                    // Base circle
                    ctx.fillStyle = body.color;
                    ctx.beginPath();
                    ctx.arc(0, 0, body.circleRadius, 0, 2 * Math.PI);
                    ctx.fill();
                    
                    // Subtle inner border for crispness
                    ctx.lineWidth = 1;
                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.1)';
                    ctx.stroke();

                    // Text (Keep text upright)
                    ctx.rotate(-body.angle);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '600 14px "Pretendard Variable", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    
                    // Truncate long names (e.g., limit to 3 chars on the marble)
                    let displayName = body.nameText;
                    if(displayName.length > 3) {
                        displayName = displayName.substring(0, 2) + '..';
                    }
                    
                    ctx.fillText(displayName, 0, 1);
                    ctx.translate(-body.position.x, -body.position.y);
                }
            }
        }

        startBtn.addEventListener('click', () => {
            if (isSimulating) {
                showAlert('알림', '이미 추첨이 진행 중입니다.');
                return;
            }

            const rawText = nameInput.value.trim();
            if (!rawText) {
                showAlert('알림', '참가자 이름을 먼저 입력해주세요.');
                return;
            }

            const names = rawText.split(/\n|,/).map(n => n.trim()).filter(n => n !== '');
            
            if (names.length < 2) {
                showAlert('알림', '최소 2명 이상의 이름을 입력해야 합니다.');
                return;
            }

            if (names.length > 50) {
                 showAlert('알림', '원활한 진행을 위해 최대 50명까지만 권장합니다.');
                 names.splice(50); 
            }

            rankings = [];
            updateRankingUI();
            rankingPanel.classList.remove('hidden');
            nameInput.disabled = true;

            initPhysics();
            spawnMarbles(names);
            
            isSimulating = true;
            renderLoop();
        });

        resetBtn.addEventListener('click', () => {
            isSimulating = false;
            nameInput.disabled = false;
            nameInput.value = '';
            rankings = [];
            rankingPanel.classList.add('hidden');
            rankingList.innerHTML = '';
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if(engine) {
                Matter.Engine.clear(engine);
            }
            drawInitialScreen();
        });

        function drawInitialScreen() {
            initPhysics();
            ctx.fillStyle = '#94a3b8'; // slate-400
            ctx.font = '500 18px "Pretendard Variable", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('좌측 명단을 입력한 후 추첨을 시작하세요.', logicalWidth / 2, logicalHeight / 2);
        }

        drawInitialScreen();

    </script>
</body>
</html>
