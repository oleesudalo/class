<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>환경 지킴이 네오봇 기획서</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
        }

        /* 커스텀 체크박스 스타일 */
        .part-checkbox {
            display: none;
        }
        .part-label {
            transition: all 0.2s ease-in-out;
            border: 2px solid transparent;
        }
        .part-checkbox:checked + .part-label {
            background-color: #d1fae5; /* green-100 */
            border-color: #10b981; /* green-500 */
            color: #047857; /* green-800 */
            font-weight: 700;
        }

        /* PDF 변환용 특수 스타일 */
        .pdf-mode {
            padding: 1.5rem 2rem !important; /* 패딩 축소 */
            box-shadow: none !important;
            border-radius: 0 !important;
            max-width: 100% !important;
            width: 100% !important;
        }
        
        .pdf-mode .pdf-hide {
            display: none !important;
        }

        /* 입력 폼 PDF 최적화 */
        .pdf-mode input[type="text"], 
        .pdf-mode textarea {
            background-color: transparent !important;
            border: 1px solid #d1d5db !important; /* 연한 테두리만 남김 */
            resize: none !important;
        }
        .pdf-mode textarea {
            height: 100px !important; /* 높이 고정으로 레이아웃 밀림 방지 */
        }
        
        .pdf-mode .info-input {
            border: none !important;
            border-bottom: 1px solid #000 !important;
            border-radius: 0;
        }

        /* 룰렛 텍스트 깜빡임 효과 */
        .slot-text {
            display: inline-block;
            min-width: 80px;
            text-align: center;
        }
    </style>
</head>
<body class="bg-gray-100 flex justify-center p-4 min-h-screen text-gray-800">

    <!-- 레이아웃을 고정해주는 Outer Wrapper (이 부분이 중요합니다) -->
    <div class="max-w-3xl w-full">
        
        <!-- 실제 PDF 캡처 타겟 영역 -->
        <div id="capture-area" class="bg-white p-8 rounded-xl shadow-lg w-full mb-6">
            
            <!-- 타이틀 및 기본 정보 -->
            <header class="text-center mb-6">
                <h1 class="text-green-600 font-bold text-3xl mb-2">🌍 환경 지킴이 네오봇 기획서</h1>
                <p class="text-gray-500 font-medium">아이디어 룰렛을 돌리고 나만의 멋진 로봇을 기획해 보세요!</p>
                
                <div class="flex justify-end gap-3 mt-6 text-lg font-bold">
                    <div class="flex items-end gap-1">
                        <input type="text" placeholder="학년" class="info-input w-12 border-b-2 border-green-300 focus:border-green-600 outline-none text-center bg-transparent py-1">
                        <span class="text-sm text-gray-600 mb-1">학년</span>
                    </div>
                    <div class="flex items-end gap-1">
                        <input type="text" placeholder="반" class="info-input w-12 border-b-2 border-green-300 focus:border-green-600 outline-none text-center bg-transparent py-1">
                        <span class="text-sm text-gray-600 mb-1">반</span>
                    </div>
                    <div class="flex items-end gap-1">
                        <input type="text" placeholder="이름" class="info-input w-24 border-b-2 border-green-300 focus:border-green-600 outline-none text-center bg-transparent py-1">
                    </div>
                </div>
            </header>

            <!-- 룰렛 결과 요약 박스 -->
            <div class="bg-green-50 border-l-4 border-green-500 p-5 rounded-r-lg mb-4 shadow-sm">
                <p class="text-lg md:text-xl font-medium leading-loose break-keep">
                    "나는 
                    <span id="r-place" class="slot-text font-bold text-green-700 border-b-2 border-green-300 mx-1 px-1">_____</span>에서 
                    <span id="r-target" class="slot-text font-bold text-blue-700 border-b-2 border-blue-300 mx-1 px-1">_____</span>을(를) 위해 
                    <span id="r-function" class="slot-text font-bold text-orange-700 border-b-2 border-orange-300 mx-1 px-1">_____</span> 로봇을 만들거야!"
                </p>
            </div>
            
            <!-- 룰렛 돌리기 버튼 (PDF 변환 시 숨김) -->
            <div class="text-center mb-8 pdf-hide">
                <button id="roulette-btn" class="bg-yellow-400 hover:bg-yellow-500 text-yellow-900 font-bold py-2 px-6 rounded-full shadow transition-transform transform active:scale-95 text-lg">
                    🎲 아이디어 룰렛 돌리기
                </button>
            </div>

            <!-- 기획서 폼 섹션 1 -->
            <div class="mb-6">
                <label class="block text-gray-800 font-bold mb-2 text-lg">1. 로봇의 이름은 무엇인가요?</label>
                <input type="text" placeholder="로봇의 멋진 이름을 지어주세요." class="w-full bg-gray-50 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-400 focus:bg-white text-lg">
            </div>

            <!-- 기획서 폼 섹션 2 -->
            <div class="mb-6">
                <label class="block text-gray-800 font-bold mb-3 text-lg">2. 어떤 네오봇 부품이 필요할까요? (모두 선택)</label>
                <div class="flex flex-wrap gap-2" id="parts-container">
                    <!-- 체크박스 항목들 (하드코딩으로 깔끔하게 배치) -->
                    <label class="cursor-pointer"><input type="checkbox" class="part-checkbox"><span class="part-label inline-block bg-gray-100 text-gray-700 px-3 py-2 rounded-md font-medium">👁️ 적외선센서</span></label>
                    <label class="cursor-pointer"><input type="checkbox" class="part-checkbox"><span class="part-label inline-block bg-gray-100 text-gray-700 px-3 py-2 rounded-md font-medium">👂 소리센서</span></label>
                    <label class="cursor-pointer"><input type="checkbox" class="part-checkbox"><span class="part-label inline-block bg-gray-100 text-gray-700 px-3 py-2 rounded-md font-medium">👆 접촉센서</span></label>
                    <label class="cursor-pointer"><input type="checkbox" class="part-checkbox"><span class="part-label inline-block bg-gray-100 text-gray-700 px-3 py-2 rounded-md font-medium">☀️ 빛센서</span></label>
                    <label class="cursor-pointer"><input type="checkbox" class="part-checkbox"><span class="part-label inline-block bg-gray-100 text-gray-700 px-3 py-2 rounded-md font-medium">💡 LED</span></label>
                    <label class="cursor-pointer"><input type="checkbox" class="part-checkbox"><span class="part-label inline-block bg-gray-100 text-gray-700 px-3 py-2 rounded-md font-medium">⚙️ 모터</span></label>
                    <label class="cursor-pointer"><input type="checkbox" class="part-checkbox"><span class="part-label inline-block bg-gray-100 text-gray-700 px-3 py-2 rounded-md font-medium">🔔 부저</span></label>
                </div>
            </div>

            <!-- 기획서 폼 섹션 3 -->
            <div class="mb-2">
                <label class="block text-gray-800 font-bold mb-2 text-lg">3. 로봇의 주요 기능과 특징을 자세히 적어주세요.</label>
                <textarea rows="5" placeholder="선택한 부품들이 어떻게 작동해서 임무를 수행하는지 구체적으로 설명해주세요." class="w-full bg-gray-50 border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-green-400 focus:bg-white text-base leading-relaxed"></textarea>
            </div>

        </div>

        <!-- PDF 저장 버튼 (캡처 영역 밖) -->
        <div class="text-center">
            <button id="pdf-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-transform transform active:scale-95 text-lg flex items-center justify-center mx-auto gap-2 w-full md:w-auto">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" /></svg>
                기획서 PDF로 저장하기
            </button>
        </div>

    </div>

    <script>
        // 1. 테마 데이터베이스 구성 (문맥이 맞도록 세트별 분류)
        const themesData = [
            {
                theme: "바다",
                places: ['해안가', '깊은 바다', '갯벌'],
                targets: ['해양 생물', '바다 거북이', '산호초'],
                functions: ['떠다니는 플라스틱을 건져내는', '기름 유출을 막아주는', '버려진 그물을 수거하는']
            },
            {
                theme: "도시",
                places: ['동네 골목길', '아파트 분리수거장', '번화가'],
                targets: ['환경 미화원', '길고양이', '시민들'],
                functions: ['재활용품을 자동으로 분류하는', '길거리 쓰레기를 쓸어담는', '미세먼지를 정화해주는']
            },
            {
                theme: "숲",
                places: ['국립공원', '등산로', '계곡'],
                targets: ['야생동물', '등산객', '나무들'],
                functions: ['산불을 감지하고 경고하는', '버려진 쓰레기를 찾아내는', '다친 동물을 구조하는']
            },
            {
                theme: "학교",
                places: ['학교 운동장', '급식실', '교실'],
                targets: ['학생들', '청소 당번', '선생님'],
                functions: ['남은 음식물을 퇴비로 만드는', '올바른 분리수거 방법을 알려주는', '바닥의 먼지를 청소하는']
            }
        ];

        // 룰렛 시각 효과용 모든 데이터 통합
        const allPlaces = themesData.flatMap(t => t.places);
        const allTargets = themesData.flatMap(t => t.targets);
        const allFunctions = themesData.flatMap(t => t.functions);

        // 2. 룰렛 로직
        const rBtn = document.getElementById('roulette-btn');
        const spanPlace = document.getElementById('r-place');
        const spanTarget = document.getElementById('r-target');
        const spanFunction = document.getElementById('r-function');

        let isSpinning = false;

        function getRandomElement(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        rBtn.addEventListener('click', () => {
            if (isSpinning) return;
            isSpinning = true;
            rBtn.disabled = true;
            rBtn.classList.add('opacity-75');
            rBtn.innerText = "🎲 섞는 중...";

            let ticks = 0;
            const maxTicks = 15; // 룰렛 돌아가는 횟수

            // 룰렛 효과
            const interval = setInterval(() => {
                spanPlace.innerText = getRandomElement(allPlaces);
                spanTarget.innerText = getRandomElement(allTargets);
                spanFunction.innerText = getRandomElement(allFunctions);
                
                spanPlace.style.opacity = Math.random() * 0.5 + 0.5;
                spanTarget.style.opacity = Math.random() * 0.5 + 0.5;
                spanFunction.style.opacity = Math.random() * 0.5 + 0.5;

                ticks++;

                if (ticks >= maxTicks) {
                    clearInterval(interval);
                    
                    // 최종 결과 선정 (동일 테마에서 뽑아 자연스럽게 연결)
                    const selectedTheme = getRandomElement(themesData);
                    spanPlace.innerText = getRandomElement(selectedTheme.places);
                    spanTarget.innerText = getRandomElement(selectedTheme.targets);
                    spanFunction.innerText = getRandomElement(selectedTheme.functions);

                    // 스타일 원상복구
                    [spanPlace, spanTarget, spanFunction].forEach(el => {
                        el.style.opacity = 1;
                        // 결과 강조 애니메이션
                        el.style.transform = "scale(1.1)";
                        setTimeout(() => el.style.transform = "scale(1)", 200);
                    });

                    isSpinning = false;
                    rBtn.disabled = false;
                    rBtn.classList.remove('opacity-75');
                    rBtn.innerText = "🎲 아이디어 룰렛 다시 돌리기";
                }
            }, 80);
        });

        // 3. PDF 저장 로직 (에러 원천 차단 구조)
        const pdfBtn = document.getElementById('pdf-btn');
        const captureArea = document.getElementById('capture-area');
        const rouletteBtn = document.getElementById('roulette-btn');

        pdfBtn.addEventListener('click', () => {
            // 버튼 상태 변경
            pdfBtn.disabled = true;
            const originalBtnText = pdfBtn.innerHTML;
            pdfBtn.innerHTML = `⏳ 생성 중...`;

            // 중요: 스크롤을 맨 위로 고정하여 빈 공간 캡처 방지
            window.scrollTo(0, 0);

            // PDF 전용 스타일 적용 (여백 조절 및 특정 UI 숨김)
            captureArea.classList.add('pdf-mode');

            // html2pdf 옵션 설정
            const opt = {
                margin:       10, // 여백 (mm)
                filename:     '환경지킴이_네오봇_기획서.pdf',
                image:        { type: 'jpeg', quality: 1 },
                html2canvas:  { 
                    scale: 2, 
                    scrollY: 0, 
                    scrollX: 0,
                    useCORS: true 
                },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            // PDF 생성 시작
            html2pdf().set(opt).from(captureArea).save().then(() => {
                // PDF 생성 후 원래 화면으로 복구
                captureArea.classList.remove('pdf-mode');
                pdfBtn.disabled = false;
                pdfBtn.innerHTML = originalBtnText;
            }).catch(err => {
                alert("PDF 저장 중 오류가 발생했습니다.");
                captureArea.classList.remove('pdf-mode');
                pdfBtn.disabled = false;
                pdfBtn.innerHTML = originalBtnText;
                console.error(err);
            });
        });
    </script>
</body>
</html>
